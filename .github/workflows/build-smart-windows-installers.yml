name: Build Smart Windows Installers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - '1.7.0'
      - 'v1.7.0'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build from (example: 1.7.0 or v1.7.0)'
        required: true
        default: '1.7.0'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Smart Installer x64
    runs-on: windows-latest
    outputs:
      resolved_tag: ${{ steps.resolve_tag.outputs.resolved_tag }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and checkout tag
        id: resolve_tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          $requested = "$env:REQUESTED_TAG".Trim()
          if ([string]::IsNullOrWhiteSpace($requested)) {
            throw "No tag value was provided by the event context."
          }

          $candidates = New-Object System.Collections.Generic.List[string]
          $candidates.Add($requested)
          if ($requested.StartsWith("v")) {
            $withoutV = $requested.Substring(1)
            if (-not [string]::IsNullOrWhiteSpace($withoutV)) {
              $candidates.Add($withoutV)
            }
          } else {
            $candidates.Add("v$requested")
          }

          $resolved = $null
          foreach ($tag in $candidates) {
            git rev-parse -q --verify "refs/tags/$tag" *> $null
            if ($LASTEXITCODE -eq 0) {
              $resolved = $tag
              break
            }
          }

          if (-not $resolved) {
            Write-Host "Requested tag: $requested"
            Write-Host "Tried candidates: $($candidates -join ', ')"
            Write-Host "Available related tags:"
            git tag --list "*1.7.0*"
            throw "Could not resolve a valid tag."
          }

          git checkout "refs/tags/$resolved"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout resolved tag: $resolved"
          }

          "resolved_tag=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved tag: $resolved"

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Smart Windows x64 installer
        working-directory: installers
        run: pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm

      - name: Verify generated file
        shell: powershell
        run: |
          if (-not (Test-Path "installers/dist/OpenSable-SmartInstaller-Windows-x64.exe")) {
            throw "Missing output: installers/dist/OpenSable-SmartInstaller-Windows-x64.exe"
          }

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSable-SmartInstaller-Windows-x64
          path: installers/dist/OpenSable-SmartInstaller-Windows-x64.exe

  build-windows-x86:
    name: Build Smart Installer x86
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and checkout tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          $requested = "$env:REQUESTED_TAG".Trim()
          if ([string]::IsNullOrWhiteSpace($requested)) {
            throw "No tag value was provided by the event context."
          }

          $candidates = New-Object System.Collections.Generic.List[string]
          $candidates.Add($requested)
          if ($requested.StartsWith("v")) {
            $withoutV = $requested.Substring(1)
            if (-not [string]::IsNullOrWhiteSpace($withoutV)) {
              $candidates.Add($withoutV)
            }
          } else {
            $candidates.Add("v$requested")
          }

          $resolved = $null
          foreach ($tag in $candidates) {
            git rev-parse -q --verify "refs/tags/$tag" *> $null
            if ($LASTEXITCODE -eq 0) {
              $resolved = $tag
              break
            }
          }

          if (-not $resolved) {
            Write-Host "Requested tag: $requested"
            Write-Host "Tried candidates: $($candidates -join ', ')"
            Write-Host "Available related tags:"
            git tag --list "*1.7.0*"
            throw "Could not resolve a valid tag."
          }

          git checkout "refs/tags/$resolved"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout resolved tag: $resolved"
          }

          Write-Host "Resolved tag: $resolved"

      - name: Set up Python 3.12 x86
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Smart Windows x86 installer
        working-directory: installers
        run: pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm

      - name: Verify generated file
        shell: powershell
        run: |
          if (-not (Test-Path "installers/dist/OpenSable-SmartInstaller-Windows-x86.exe")) {
            throw "Missing output: installers/dist/OpenSable-SmartInstaller-Windows-x86.exe"
          }

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSable-SmartInstaller-Windows-x86
          path: installers/dist/OpenSable-SmartInstaller-Windows-x86.exe

  release-assets:
    name: Attach Smart Installers to Release
    runs-on: ubuntu-latest
    needs: [build-windows-x64, build-windows-x86]
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to GitHub Release (manual tag)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows-x64.outputs.resolved_tag }}
          files: |
            artifacts/OpenSable-SmartInstaller-Windows-x64/OpenSable-SmartInstaller-Windows-x64.exe
            artifacts/OpenSable-SmartInstaller-Windows-x86/OpenSable-SmartInstaller-Windows-x86.exe
          draft: false
          prerelease: false

      - name: Upload assets to GitHub Release (event tag)
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenSable-SmartInstaller-Windows-x64/OpenSable-SmartInstaller-Windows-x64.exe
            artifacts/OpenSable-SmartInstaller-Windows-x86/OpenSable-SmartInstaller-Windows-x86.exe
          draft: false
          prerelease: false
