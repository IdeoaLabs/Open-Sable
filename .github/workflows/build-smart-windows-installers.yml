name: Build Smart Windows Installers

on:
  push:
    branches:
      - master
    tags:
      - '1.7.0'
      - 'v1.7.0'
    paths:
      - '.github/workflows/build-smart-windows-installers.yml'
      - 'installers/installer_gui_windows_smart.py'
      - 'installers/opensable-installer-windows-smart.spec'
      - 'installers/assets/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload assets to (example: 1.7.0 or v1.7.0)"
        required: true
        default: 1.7.0
      build_ref:
        description: "Source ref to build from (branch, tag, or commit SHA)"
        required: true
        default: master

permissions:
  contents: write

jobs:
  build-x64-and-release:
    name: Build x64 and upload to release
    runs-on: windows-latest
    env:
      BUILD_REF: ${{ github.event.inputs.build_ref || github.sha }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.7.0' }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Validate required files
        shell: pwsh
        run: |
          $required = @(
            "installers/installer_gui_windows_smart.py",
            "installers/opensable-installer-windows-smart.spec",
            "installers/assets/icon.ico"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              throw "Missing required file: $f"
            }
          }

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build x64 installer
        shell: pwsh
        working-directory: installers
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm > pyinstaller-x64.log 2>&1"
          $rc = $LASTEXITCODE
          if (-not (Test-Path pyinstaller-x64.log)) {
            "PyInstaller log was not generated." | Out-File -FilePath pyinstaller-x64.log -Encoding utf8
          }
          if ($rc -ne 0) {
            Write-Host "--- Last 250 lines of pyinstaller-x64.log ---"
            Get-Content pyinstaller-x64.log -Tail 250
            throw "x64 build failed with exit code $rc"
          }
          if (-not (Test-Path "dist/Open-Sable-SmartInstaller-Windows-x64.exe")) {
            throw "x64 build completed but output EXE is missing"
          }

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Automated smart installer release assets"
          }

      - name: Upload x64 assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          gh release delete-asset $tag "OpenSable-SmartInstaller-Windows-x64.exe" --yes *> $null
          gh release upload $tag "installers/dist/Open-Sable-SmartInstaller-Windows-x64.exe" --clobber
          gh release upload $tag "installers/pyinstaller-x64.log" --clobber

  build-x86:
    name: Build x86 and upload to release
    runs-on: windows-latest
    needs: build-x64-and-release
    env:
      BUILD_REF: ${{ github.event.inputs.build_ref || github.sha }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.7.0' }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Set up Python 3.12 x86
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x86"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build x86 installer
        shell: pwsh
        working-directory: installers
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm > pyinstaller-x86.log 2>&1"
          $rc = $LASTEXITCODE
          if (-not (Test-Path pyinstaller-x86.log)) {
            "PyInstaller log was not generated." | Out-File -FilePath pyinstaller-x86.log -Encoding utf8
          }
          if ($rc -ne 0) {
            Write-Host "--- Last 250 lines of pyinstaller-x86.log ---"
            Get-Content pyinstaller-x86.log -Tail 250
            throw "x86 build failed with exit code $rc"
          }
          if (-not (Test-Path "dist/Open-Sable-SmartInstaller-Windows-x86.exe")) {
            throw "x86 build completed but output EXE is missing"
          }

      - name: Upload x86 assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          gh release delete-asset $tag "OpenSable-SmartInstaller-Windows-x86.exe" --yes *> $null
          gh release upload $tag "installers/dist/Open-Sable-SmartInstaller-Windows-x86.exe" --clobber
          gh release upload $tag "installers/pyinstaller-x86.log" --clobber
