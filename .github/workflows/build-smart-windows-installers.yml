name: Build Smart Windows Installers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_BUILD_REF: master

on:
  push:
    tags:
      - '1.7.0'
      - 'v1.7.0'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build from (example: 1.7.0 or v1.7.0)'
        required: true
        default: '1.7.0'
      build_ref:
        description: 'Source ref to build (branch, tag, or commit SHA). Example: master'
        required: true
        default: 'master'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Smart Installer x64
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_ref || env.DEFAULT_BUILD_REF }}
          fetch-depth: 0

      - name: Validate required installer files
        shell: pwsh
        run: |
          $required = @(
            "installers/installer_gui_windows_smart.py",
            "installers/opensable-installer-windows-smart.spec",
            "installers/assets/icon.ico"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              throw "Missing required file in selected ref: $f"
            }
          }

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Smart Windows x64 installer
        id: build_x64
        shell: pwsh
        working-directory: installers
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Python:"; python --version
          Write-Host "Pip:"; python -m pip --version
          Write-Host "PyInstaller:"; pyinstaller --version
          cmd /c "pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm --noupx > pyinstaller-x64.log 2>&1"
          $buildExit = $LASTEXITCODE
          if (-not (Test-Path pyinstaller-x64.log)) {
            "PyInstaller log was not generated." | Out-File -FilePath pyinstaller-x64.log -Encoding utf8
          }
          "build_exit=$buildExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Verify generated file
        if: steps.build_x64.outputs.build_exit == '0'
        shell: powershell
        run: |
          if (-not (Test-Path "installers/dist/OpenSable-SmartInstaller-Windows-x64.exe")) {
            throw "Missing output: installers/dist/OpenSable-SmartInstaller-Windows-x64.exe"
          }

      - name: Upload x64 artifact
        if: steps.build_x64.outputs.build_exit == '0'
        uses: actions/upload-artifact@v5
        with:
          name: OpenSable-SmartInstaller-Windows-x64
          path: installers/dist/OpenSable-SmartInstaller-Windows-x64.exe

      - name: Upload x64 build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OpenSable-SmartInstaller-Windows-x64-log
          path: installers/pyinstaller-x64.log

      - name: Fail x64 job if build failed
        if: steps.build_x64.outputs.build_exit != '0'
        shell: pwsh
        working-directory: installers
        run: |
          Write-Host "--- Last 250 lines of pyinstaller-x64.log ---"
          Get-Content pyinstaller-x64.log -Tail 250
          throw "PyInstaller x64 failed with exit code ${{ steps.build_x64.outputs.build_exit }}"

  build-windows-x86:
    name: Build Smart Installer x86
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_ref || env.DEFAULT_BUILD_REF }}
          fetch-depth: 0

      - name: Validate required installer files
        shell: pwsh
        run: |
          $required = @(
            "installers/installer_gui_windows_smart.py",
            "installers/opensable-installer-windows-smart.spec",
            "installers/assets/icon.ico"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              throw "Missing required file in selected ref: $f"
            }
          }

      - name: Set up Python 3.12 x86
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Smart Windows x86 installer
        id: build_x86
        shell: pwsh
        working-directory: installers
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Python:"; python --version
          Write-Host "Pip:"; python -m pip --version
          Write-Host "PyInstaller:"; pyinstaller --version
          cmd /c "pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm --noupx > pyinstaller-x86.log 2>&1"
          $buildExit = $LASTEXITCODE
          if (-not (Test-Path pyinstaller-x86.log)) {
            "PyInstaller log was not generated." | Out-File -FilePath pyinstaller-x86.log -Encoding utf8
          }
          "build_exit=$buildExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Verify generated file
        if: steps.build_x86.outputs.build_exit == '0'
        shell: powershell
        run: |
          if (-not (Test-Path "installers/dist/OpenSable-SmartInstaller-Windows-x86.exe")) {
            throw "Missing output: installers/dist/OpenSable-SmartInstaller-Windows-x86.exe"
          }

      - name: Upload x86 artifact
        if: steps.build_x86.outputs.build_exit == '0'
        uses: actions/upload-artifact@v5
        with:
          name: OpenSable-SmartInstaller-Windows-x86
          path: installers/dist/OpenSable-SmartInstaller-Windows-x86.exe

      - name: Upload x86 build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OpenSable-SmartInstaller-Windows-x86-log
          path: installers/pyinstaller-x86.log

      - name: Fail x86 job if build failed
        if: steps.build_x86.outputs.build_exit != '0'
        shell: pwsh
        working-directory: installers
        run: |
          Write-Host "--- Last 250 lines of pyinstaller-x86.log ---"
          Get-Content pyinstaller-x86.log -Tail 250
          throw "PyInstaller x86 failed with exit code ${{ steps.build_x86.outputs.build_exit }}"

  release-assets:
    name: Attach Smart Installers to Release
    runs-on: ubuntu-latest
    needs: [build-windows-x64, build-windows-x86]
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Upload assets to GitHub Release (manual tag)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          overwrite_files: true
          files: |
            artifacts/OpenSable-SmartInstaller-Windows-x64/OpenSable-SmartInstaller-Windows-x64.exe
            artifacts/OpenSable-SmartInstaller-Windows-x86/OpenSable-SmartInstaller-Windows-x86.exe
          draft: false
          prerelease: false

      - name: Upload assets to GitHub Release (event tag)
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            artifacts/OpenSable-SmartInstaller-Windows-x64/OpenSable-SmartInstaller-Windows-x64.exe
            artifacts/OpenSable-SmartInstaller-Windows-x86/OpenSable-SmartInstaller-Windows-x86.exe
          draft: false
          prerelease: false
