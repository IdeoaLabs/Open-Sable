name: Build Smart Windows Installers

on:
  push:
    tags:
      - '1.7.0'
      - 'v1.7.0'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build from (example: 1.7.0 or v1.7.0)'
        required: true
        default: '1.7.0'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Smart Installer x64
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Smart Windows x64 installer
        working-directory: installers
        run: pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm

      - name: Verify generated file
        shell: powershell
        run: |
          if (-not (Test-Path "installers/dist/OpenSable-SmartInstaller-Windows-x64.exe")) {
            throw "Missing output: installers/dist/OpenSable-SmartInstaller-Windows-x64.exe"
          }

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSable-SmartInstaller-Windows-x64
          path: installers/dist/OpenSable-SmartInstaller-Windows-x64.exe

  build-windows-x86:
    name: Build Smart Installer x86
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Set up Python 3.12 x86
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Smart Windows x86 installer
        working-directory: installers
        run: pyinstaller opensable-installer-windows-smart.spec --clean --noconfirm

      - name: Verify generated file
        shell: powershell
        run: |
          if (-not (Test-Path "installers/dist/OpenSable-SmartInstaller-Windows-x86.exe")) {
            throw "Missing output: installers/dist/OpenSable-SmartInstaller-Windows-x86.exe"
          }

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSable-SmartInstaller-Windows-x86
          path: installers/dist/OpenSable-SmartInstaller-Windows-x86.exe

  release-assets:
    name: Attach Smart Installers to Release
    runs-on: ubuntu-latest
    needs: [build-windows-x64, build-windows-x86]
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/1.7.0') ||
      startsWith(github.ref, 'refs/tags/v1.7.0') ||
      github.event.release.tag_name == '1.7.0' ||
      github.event.release.tag_name == 'v1.7.0'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to GitHub Release (manual tag)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: |
            artifacts/OpenSable-SmartInstaller-Windows-x64/OpenSable-SmartInstaller-Windows-x64.exe
            artifacts/OpenSable-SmartInstaller-Windows-x86/OpenSable-SmartInstaller-Windows-x86.exe
          draft: false
          prerelease: false

      - name: Upload assets to GitHub Release (event tag)
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenSable-SmartInstaller-Windows-x64/OpenSable-SmartInstaller-Windows-x64.exe
            artifacts/OpenSable-SmartInstaller-Windows-x86/OpenSable-SmartInstaller-Windows-x86.exe
          draft: false
          prerelease: false
